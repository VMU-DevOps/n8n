<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Captcha GDT OCR So Sánh</title>
  <script>
    async function detectCaptcha() {
      const res = await fetch("/captcha");
      const data = await res.json();

      document.getElementById("captcha_easy").value = data.captcha_easyocr || "";
      document.getElementById("captcha_paddle").value = data.captcha_paddleocr || "";

      document.getElementById("originalImg").src = "data:image/png;base64," + data.original_image;
      document.getElementById("processedImg").src = "data:image/png;base64," + data.image;
      document.getElementById("fullScreenshot").src = "data:image/png;base64," + data.screenshot;
    }

    window.onload = detectCaptcha;
  </script>
</head>
<body>
  <h2>So sánh nhận diện Captcha GDT</h2>
  <p>EasyOCR:</p>
  <input id="captcha_easy" readonly><br/>
  <p>PaddleOCR:</p>
  <input id="captcha_paddle" readonly><br/>
  <button onclick="detectCaptcha()">📸 Lấy Captcha mới</button><br/><br/>
  <p>Ảnh gốc:</p>
  <img id="originalImg" style="max-width:150px;"><br/>
  <p>Ảnh đã xử lý:</p>
  <img id="processedImg" style="max-width:150px;"><br/>
  <p>Toàn bộ giao diện:</p>
  <img id="fullScreenshot" style="max-width:100%;">
</body>
</html>
