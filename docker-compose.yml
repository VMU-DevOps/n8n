services:
  n8n:
    build: .
    container_name: n8n-cheerio
    ports:
      - 15678:5678
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=15432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      - N8N_HOST=agent.zone1.vimaru.edu.vn       # Replace or remove as needed
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=true
      - WEBHOOK_URL=https://agent.zone1.vimaru.edu.vn # Replace or remove as needed
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
 
volumes:
  n8n_data: