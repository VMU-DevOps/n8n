<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đăng nhập GDT</title>
  <script>
    async function loadCaptcha() {
      const res = await fetch("/captcha");
      const data = await res.json();
      if (data.image) {
        document.getElementById("captchaImg").src = "data:image/png;base64," + data.image;
      }
      document.getElementById("captcha_code").value = data.captcha_code || "";
    }

    function autofillCaptcha() {
      document.getElementById("captcha").value = document.getElementById("captcha_code").value;
    }

    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const captcha = document.getElementById("captcha").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username, password, captcha })
      });

      const data = await res.json();
      const result = document.getElementById("result");
      if (data.status === "success") {
        result.textContent = "✅ Đăng nhập thành công!";
        result.style.color = "green";
      } else {
        result.textContent = "❌ Đăng nhập thất bại!";
        result.style.color = "red";
      }
    }

    window.onload = loadCaptcha;
  </script>
</head>
<body>
  <h2>Đăng nhập GDT</h2>
  <form onsubmit="event.preventDefault(); login();">
    <label>Tên đăng nhập: <input type="text" id="username" /></label><br/>
    <label>Mật khẩu: <input type="password" id="password" /></label><br/>
    <label>Mã captcha: <input type="text" id="captcha" /></label><br/>
    <img id="captchaImg" alt="Captcha" /><br/>
    <input type="hidden" id="captcha_code" />
    <button type="button" onclick="autofillCaptcha()">🔁 Nhận diện Captcha</button><br/><br/>
    <button type="submit">Đăng nhập</button>
  </form>
  <p id="result"></p>
</body>
</html>
